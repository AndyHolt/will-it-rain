[project]
name = "golden-fixtures"
version = "0.1.0"
description = "Generate the cross-language fixtures the Go backend is tested against"
requires-python = ">=3.14"
dependencies = [
    "niquests>=3.16.0",
    "openmeteo-sdk>=1.26.0",
    "pandas>=3.0.0",
    "pipeline",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.14.0",
    "will-it-rain-shared",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# `pipeline` is a dependency because the fixtures are produced by the real
# training path — fetch, prepare, train, save_serving_artefacts. A fixture
# built from a second copy of that code would pin the copy, not the contract.
[tool.uv.sources]
pipeline = { workspace = true }
will-it-rain-shared = { workspace = true }
