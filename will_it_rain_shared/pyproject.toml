[project]
name = "will-it-rain-shared"
version = "0.1.0"
description = "Common config shared between pipelines and backend"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "google-api-core>=2.21.0",
    "google-cloud-aiplatform>=1.60.0",
    "google-cloud-storage>=2.18.0",
    "joblib>=1.5.0",
    "openmeteo-sdk>=1.26.0",
    "pandas>=3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
