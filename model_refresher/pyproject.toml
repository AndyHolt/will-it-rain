[project]
name = "model-refresher"
version = "0.1.0"
description = "Cloud Function: rolls the backend Cloud Run service forward when @production moves."
requires-python = ">=3.14"
dependencies = [
    "cloudevents>=1.11.0",
    "functions-framework>=3.8.0",
    "google-cloud-run>=0.10.0",
]

# Flat layout (main.py at the package root, no src/) is required by the
# Cloud Functions buildpack — it looks for the entry-point function in a
# `main.py` at the root of the deployed source. Other workspace members use
# the src/ layout because they're imported as libraries; this one is only
# ever deployed as a function, never imported, so the flat layout is fine.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["main.py"]
