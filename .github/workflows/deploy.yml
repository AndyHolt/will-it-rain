name: deploy

# Single deploy workflow on merge to main. Path-filtered: each component
# (pipeline, backend, backend-go, frontend, infra) only builds / deploys when
# its inputs changed. Auth is via the bootstrap WIF provider impersonating the
# terraform SA — see infra/bootstrap/main.tf for the role set.

on:
  push:
    branches: [main]

concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  id-token: write # WIF token exchange
  contents: read

# PROJECT_ID / REGION / HOSTING_SITE_ID are not declared here — they come from
# config.env, loaded per-job by ./.github/actions/load-config (workflow-level
# env can't be populated from a step). The WIF values stay literal: the
# provider path embeds the project *number*, which config.env doesn't carry.
env:
  WIF_PROVIDER: projects/238441820154/locations/global/workloadIdentityPools/github-actions/providers/github
  WIF_SERVICE_ACCOUNT: terraform@will-it-rain-496308.iam.gserviceaccount.com

jobs:
  # ---------------------------------------------------------------------------
  # Determine which components changed in this push. Each downstream job gates
  # on the corresponding output. Shared library + workspace lockfile changes
  # bust both the pipeline and backend images (they're in both images).
  # ---------------------------------------------------------------------------
  changes:
    runs-on: ubuntu-latest
    outputs:
      pipeline: ${{ steps.filter.outputs.pipeline }}
      backend: ${{ steps.filter.outputs.backend }}
      backend_go: ${{ steps.filter.outputs.backend_go }}
      frontend: ${{ steps.filter.outputs.frontend }}
      infra: ${{ steps.filter.outputs.infra }}
      model_refresher: ${{ steps.filter.outputs.model_refresher }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # config.env is in every filter: it names the project everything
          # deploys to, so a change to it invalidates every artefact — images
          # land in a different registry, buckets and the Cloud Run service
          # move. Without it a project change would merge as a no-op.
          filters: |
            pipeline:
              - 'pipeline/**'
              - 'will_it_rain_shared/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'Makefile'
              - 'config.env'
            backend:
              - 'backend/**'
              - 'will_it_rain_shared/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'Makefile'
              - 'config.env'
            # Narrower than `backend` on purpose: backend-go is a self-contained
            # Go module with its own go.mod, so neither will_it_rain_shared nor
            # the uv lockfile is an input to its image.
            backend_go:
              - 'backend-go/**'
              - 'Makefile'
              - 'config.env'
            frontend:
              - 'frontend/**'
              - 'config.env'
            infra:
              - 'infra/main/**'
              - 'config.env'
            model_refresher:
              - 'model_refresher/**'
              - 'Makefile'
              - 'config.env'

  # ---------------------------------------------------------------------------
  # Build + push container images. The jobs are independent; any of them can
  # run, gated by path filters.
  # ---------------------------------------------------------------------------
  build-pipeline-image:
    needs: changes
    if: needs.changes.outputs.pipeline == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/load-config
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Configure Docker credential helper for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet
      - uses: docker/setup-buildx-action@v3
      - name: Build and push pipeline image
        run: make image

  build-backend-image:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/load-config
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Configure Docker credential helper for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet
      - uses: docker/setup-buildx-action@v3
      - name: Build and push backend image
        run: make backend-image

  build-backend-go-image:
    needs: changes
    if: needs.changes.outputs.backend_go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/load-config
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Configure Docker credential helper for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet
      - uses: docker/setup-buildx-action@v3
      # No Go toolchain step: the Dockerfile's builder stage owns the
      # compile. go.yml is what runs vet and the tests.
      - name: Build and push backend-go image
        run: make backend-go-image

  # ---------------------------------------------------------------------------
  # Compile the KFP pipeline spec and upload to GCS. infra/main/scheduler.tf
  # reads this object at plan time and inlines it into the scheduler job body,
  # so this MUST run before terraform-apply when pipeline code changes.
  # ---------------------------------------------------------------------------
  compile-and-upload-pipeline:
    needs: changes
    if: needs.changes.outputs.pipeline == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - name: Install workspace
        run: uv sync --all-packages
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Compile pipeline spec
        run: make compile-pipeline
      - name: Upload pipeline spec to GCS
        run: make upload-pipeline

  # ---------------------------------------------------------------------------
  # Zip the model-refresher source and upload to GCS.
  # infra/main/model_refresh.tf reads the object's generation to roll a new
  # revision, so this MUST run before terraform-apply when the model_refresher
  # source changes. Same staged-artifact pattern as the pipeline YAML.
  # ---------------------------------------------------------------------------
  upload-model-refresher-source:
    needs: changes
    if: needs.changes.outputs.model_refresher == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Zip and upload model-refresher source
        run: make upload-model-refresher-source

  # ---------------------------------------------------------------------------
  # Apply infra. Needed when:
  #   - infra HCL changed (resource shape), or
  #   - pipeline changed (scheduler.tf reads the freshly-uploaded YAML), or
  #   - model_refresher changed (model_refresh.tf reads the freshly-uploaded zip).
  # Backend/frontend code changes don't change TF state (both backend images
  # are pinned to :latest in TF, deployed revisions come from the deploy jobs
  # below). The image builds are still gates: applying a service against a tag
  # whose push has just failed would pin the revision to a stale digest.
  # ---------------------------------------------------------------------------
  terraform-apply:
    needs:
      [
        changes,
        compile-and-upload-pipeline,
        upload-model-refresher-source,
        build-pipeline-image,
        build-backend-image,
        build-backend-go-image,
      ]
    if: |
      always() &&
      (needs.changes.outputs.pipeline == 'true' || needs.changes.outputs.infra == 'true' || needs.changes.outputs.model_refresher == 'true') &&
      (needs.compile-and-upload-pipeline.result == 'success' || needs.compile-and-upload-pipeline.result == 'skipped') &&
      (needs.upload-model-refresher-source.result == 'success' || needs.upload-model-refresher-source.result == 'skipped') &&
      (needs.build-pipeline-image.result == 'success' || needs.build-pipeline-image.result == 'skipped') &&
      (needs.build-backend-image.result == 'success' || needs.build-backend-image.result == 'skipped') &&
      (needs.build-backend-go-image.result == 'success' || needs.build-backend-go-image.result == 'skipped')
    runs-on: ubuntu-latest
    env:
      TF_VAR_weather_latitude: ${{ secrets.WEATHER_LATITUDE }}
      TF_VAR_weather_longitude: ${{ secrets.WEATHER_LONGITUDE }}
      TF_VAR_cosmos_uk_site_code: ${{ secrets.COSMOS_UK_SITE_CODE }}
      TF_VAR_notification_email: ${{ secrets.NOTIFICATION_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      # project_id / region / hosting_site_id have no defaults in the module;
      # they come from config.env, as TF_VAR_*.
      - uses: ./.github/actions/load-config
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform init
        run: terraform -chdir=infra/main init
      - name: Terraform apply
        run: terraform -chdir=infra/main apply -auto-approve -input=false

  # ---------------------------------------------------------------------------
  # Roll forward Cloud Run + Firebase Hosting. Both wait on terraform-apply
  # (which may be skipped on a code-only change — handled in `if`).
  # ---------------------------------------------------------------------------
  # The `backend` service runs the Go image (cloud_run.tf), so this job's
  # inputs are the Go ones: it gates on `backend_go` and waits on
  # build-backend-go-image. It deployed the Python image until that repoint,
  # and gating on `backend` after it would have pushed Python back over the Go
  # revision on any uv.lock / pyproject.toml / Makefile change.
  #
  # `backend/**` and `will_it_rain_shared/**` therefore deploy nothing now. No
  # service runs the Python image; build-backend-image still builds it, and
  # goes when the Python backend does.
  backend-deploy:
    needs: [changes, build-backend-go-image, terraform-apply]
    if: |
      always() &&
      needs.changes.outputs.backend_go == 'true' &&
      needs.build-backend-go-image.result == 'success' &&
      (needs.terraform-apply.result == 'success' || needs.terraform-apply.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/load-config
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      # Call gcloud directly rather than `make backend-go-deploy`: the make
      # recipe depends on the image sentinel, which doesn't exist on this
      # fresh runner — it would trigger a redundant local image rebuild.
      # The image was just pushed by build-backend-go-image.
      - name: Roll new Cloud Run revision
        run: |
          gcloud run services update backend \
            --region=${{ env.REGION }} \
            --image=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/will-it-rain-images/backend-go:latest

  # `gcloud run services update` needs the service to exist already —
  # cloud_run_go.tf creates it, and defaults it to the :latest tag this job
  # has just moved. So terraform-apply is a real gate here, not just ordering.
  backend-go-deploy:
    needs: [changes, build-backend-go-image, terraform-apply]
    if: |
      always() &&
      needs.changes.outputs.backend_go == 'true' &&
      needs.build-backend-go-image.result == 'success' &&
      (needs.terraform-apply.result == 'success' || needs.terraform-apply.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/load-config
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      # Same reason as backend-deploy: `make backend-go-deploy` depends on the
      # image sentinel, absent on a fresh runner, so it would rebuild the image
      # build-backend-go-image just pushed.
      - name: Roll new Cloud Run revision
        run: |
          gcloud run services update backend-go \
            --region=${{ env.REGION }} \
            --image=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/will-it-rain-images/backend-go:latest

  frontend-deploy:
    needs: [changes, terraform-apply]
    if: |
      always() &&
      needs.changes.outputs.frontend == 'true' &&
      (needs.terraform-apply.result == 'success' || needs.terraform-apply.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/load-config
      - uses: actions/setup-node@v6
        with:
          node-version: 26
      - uses: pnpm/action-setup@v6
        with:
          version: latest
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}
      # firebase.json repeats HOSTING_SITE_ID and drift is silent — the CLI
      # would publish to the project's default site instead. Same guard
      # `make frontend-deploy` runs locally.
      - name: Check firebase.json site matches config.env
        run: make frontend-site-check
      - name: Build SPA
        run: make frontend-build
      # firebase-tools picks up GOOGLE_APPLICATION_CREDENTIALS set by
      # google-github-actions/auth. --project comes from config.env; there's
      # no .firebaserc to default from, deliberately.
      - name: Deploy to Firebase Hosting
        working-directory: frontend
        run: npx -y firebase-tools@latest deploy --only hosting --non-interactive --project ${{ env.PROJECT_ID }}
