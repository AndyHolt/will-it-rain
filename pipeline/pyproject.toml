[project]
name = "pipeline"
version = "0.1.0"
description = "Training pipeline components for will-it-rain"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "google-cloud-aiplatform>=1.60.0",
    "google-cloud-storage>=2.18.0",
    "joblib>=1.5.0",
    "lightgbm>=4.6.0",
    "niquests>=3.16.0",
    "numpy>=2.4.0",
    "openmeteo-requests>=1.7.0",
    "openmeteo-sdk>=1.26.0",
    "pandas>=3.0.0",
    "pyarrow>=22.0.0",
    "pydantic-settings>=2.14.0",
    "scikit-learn>=1.8.0",
    "will-it-rain-shared",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
will-it-rain-shared = { workspace = true }
