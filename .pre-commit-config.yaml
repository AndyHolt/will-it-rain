repos:
  # General hygiene
  - repo: builtin
    hooks:
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: check-json
      - id: pretty-format-json
        args: [--autofix, --indent, "2"]
        # frontend/ is handled by biome. backend-go/testdata/ is generated by
        # `make golden-fixtures` and must stay byte-for-byte what the generator
        # wrote, so a rerun that changes nothing leaves a clean tree.
        exclude: ^(frontend/|backend-go/testdata/)
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: no-commit-to-branch
        args: [--branch, main]
      - id: detect-private-key

  # Security
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.0
    hooks:
      - id: gitleaks                    # detect hardcoded secrets

  # Python lint and check
  - repo: local
    hooks:
    - id: ruff
      name: ruff lint
      language: system
      entry: uv run ruff check --fix
      types_or: [python, pyi]
    - id: ruff-format
      name: ruff format
      language: system
      entry: uv run ruff format
      types_or: [python, pyi]
    - id: ty-check
      name: ty check
      language: system
      entry: uv run ty check
      types_or: [python, pyi]
